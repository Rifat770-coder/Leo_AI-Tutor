<style>
:root { --leo-lime: #b6ff4d; --leo-muted: #a9b8ad; --leo-border: #2b392d; }
[data-testid="stAppViewContainer"] {
  background: radial-gradient(ellipse at 53% 22%, #142019 0, #0b100e 72%);
}
[data-testid="stHeader"] { background: transparent; pointer-events:none; }
[data-testid="stHeader"] button { pointer-events:auto; }
[data-testid="stSidebar"] {
  background: linear-gradient(155deg, #243717 0%, #151f13 34%, #101b13 82%);
  border-right: 1px solid #2b392d;
}
[data-testid="stSidebar"] [data-testid="stSidebarContent"] { padding-top:0; row-gap:.25rem; }
[data-testid="stSidebar"] [data-testid="stSidebarHeader"] { flex:none; height:2.75rem; min-height:0; padding:.35rem .65rem; }

[data-testid="stSidebarUserContent"] [data-testid="stVerticalBlock"]:not([class*="st-key-sidebar_"]) { gap:.65rem; }
.st-key-navigation [role="radiogroup"] {
  display:grid; width:100%; grid-template-columns:minmax(0,1fr); gap:.2rem;
}
.st-key-navigation [role="radiogroup"] > div { display:contents; }
.st-key-navigation [data-testid="stRadioOption"] {
  box-sizing:border-box; display:flex; align-items:center; gap:.62rem; width:100%;
  margin:0; min-height:2.65rem; padding:.29rem .5rem; border:1px solid transparent;
  border-radius:.65rem; color:#e8f2e8; transition:background .18s ease;
}
.st-key-navigation [data-testid="stRadioOption"] > div > div:first-child:not([data-testid]) { display:none; }
.st-key-navigation [data-testid="stRadioOption"] p { color:inherit; font-size:.91rem; line-height:1.16; }
.st-key-navigation [data-testid="stRadioOption"]:hover { background:#213423; border-color:#3a503a; }
.st-key-navigation [data-testid="stRadioOption"]:has(input:checked) {

  box-shadow:0 5px 14px #0b170b45;
}

.st-key-navigation [data-testid="stRadioOption"]:has(input:focus-visible) {

}
.st-key-navigation [data-testid="stRadioOption"]::before {

}
.st-key-navigation [role="radiogroup"] > div:nth-child(1) { --leo-nav-icon:"⌂"; }
.st-key-navigation [role="radiogroup"] > div:nth-child(2) { --leo-nav-icon:"▷"; }
.st-key-navigation [role="radiogroup"] > div:nth-child(3) { --leo-nav-icon:"⌘"; }

}

}

.leo-heading { padding-bottom:1rem; border-bottom:1px solid var(--leo-border); margin-bottom:.65rem; }
