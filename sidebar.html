<script>
(() => {
  if (window.leoSidebarAutoCloseInstalled) return;
  window.leoSidebarAutoCloseInstalled = true;

  const phone = window.matchMedia("(max-width: 600px)");
  const navigationAction = [
    '.st-key-navigation [data-testid="stRadioOption"]',
    '.st-key-sidebar_session button'
  ].join(", ");

  document.addEventListener("click", (event) => {
    if (!phone.matches || !(event.target instanceof Element)) return;
    const action = event.target.closest(navigationAction);
    const sidebar = action?.closest('[data-testid="stSidebar"]');
    if (!sidebar || sidebar.dataset.collapsed === "true") return;

    requestAnimationFrame(() => {
      if (sidebar.isConnected && sidebar.dataset.collapsed !== "true") {
        sidebar.querySelector('button[aria-label="Collapse sidebar"]')?.click();
      }
    });
  }, { capture: true });
})();
</script>
